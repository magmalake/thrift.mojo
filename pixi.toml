[workspace]
authors = ["Marius S <39998+winding-lines@users.noreply.github.com>"]
channels = ["https://conda.modular.com/max-nightly", "conda-forge"]
name = "thrift.mojo"
version = "0.2.0"
description = "Pure-Mojo Apache Thrift serialization (TCompactProtocol, TBinaryProtocol) plus the Parquet metadata structs."
preview = ["pixi-build"]
platforms = ["osx-arm64", "linux-64"]

[tasks]
# Pure Mojo, stdlib only — consumers just `-I ../thrift.mojo/src`.
test = { cmd = "mkdir -p build && mojo build tests/test_thrift.mojo -I src -I tests -o build/thrift-test && ./build/thrift-test" }
cli = { cmd = "mkdir -p build && mojo build src/main.mojo -I src -o build/thrift-mojo && ./build/thrift-mojo" }
# Regenerate tests/fixtures/*.parquet + the pyarrow oracle JSON (needs `uv`).
fixtures = { cmd = "bash tools/gen_fixtures.sh" }
# Regenerate src/thrift/parquet_types.mojo from spec/parquet.thrift.
gen-types = { cmd = "python3 tools/gen_types.py spec/parquet.thrift src/thrift/parquet_types.mojo" }

# mojolint (lint-mojo, below): the origin and threading mistakes the compiler
# lets through, with mojo-lsp-server behind the rules. Exit 1 on findings.
lint = { cmd = "mojolint --lsp -I src -I tests src tests" }

# ── pixi-build: consumable as a pixi source dependency ──────────────────────
# Conda package name is thrift-mojo; the Mojo import stays `from thrift import …`.
[package]
name = "thrift-mojo"
version = "0.2.0"

[package.build]
backend = { name = "pixi-build-mojo", version = "0.*" }

[package.build.config.pkg]
path = "src/thrift"
name = "thrift"

[package.host-dependencies]
mojo-compiler = "==1.3.0.dev2026112505"

[package.build-dependencies]
mojo-compiler = "==1.3.0.dev2026112505"

[package.run-dependencies]
mojo-compiler = "==1.3.0.dev2026112505"

# Benchmarks run through the shared harness (magmalake/bench.mojo) and get
# their own feature, so the tin stays out of the environments that run tests.
# -I $CONDA_PREFIX/lib/mojo is what puts its precompiled package on the import
# path. A precompiled Mojo package is stamped with the compiler version that
# built it and refused by any other, so bench-mojo is pinned at a revision
# built with this repo's Mojo nightly.
[feature.bench.dependencies]
bench-mojo = { git = "https://github.com/magmalake/bench.mojo", rev = "3c5bfdb78bf5fa3082482a200f3ba01ad6466069" }

[feature.bench.tasks]
bench = "mkdir -p build && mojo build -I src -I $CONDA_PREFIX/lib/mojo bench/bench_thrift.mojo -o build/bench-thrift && ./build/bench-thrift"

[environments]
bench = ["bench"]

# One toolchain: the tin, its tests and every consumer use the same Mojo
# nightly. A precompiled Mojo package (.mojoc) loads only in the compiler
# version that built it, so the pin is exact here and in [package] above, and
# it moves across all magmalake tins together.
[dependencies]
mojo-compiler = "==1.3.0.dev2026112505"
# Added by `pixi shelf add lint-mojo`: the linter comes from GitHub as a pixi
# source dependency pinned at the revision mojoshelf published, and builds
# the `mojolint` executable into every environment next to mojo-lsp-server.
lint-mojo = { git = "https://github.com/magmalake/lint.mojo.git", rev = "b73d03bbfa458417cf9eed56f4e3b7a092d73969" }
